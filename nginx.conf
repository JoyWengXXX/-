server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sql.js 的 wasm 檔案要用正確的 MIME type，瀏覽器才能載入
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # React Router 的前端路由（例如 /topic/sql），一律導回 index.html 讓前端接手
    location / {
        try_files $uri $uri/ /index.html;
    }
}
